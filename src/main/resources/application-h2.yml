# H2 인메모리 데이터베이스 프로파일 (개발/테스트용)
# 사용법: --spring.profiles.active=h2

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:planit_schedule_db;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
